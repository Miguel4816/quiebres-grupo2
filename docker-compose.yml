name: quiebres-grupo2

x-app: &app
  build: .
  image: quiebres-grupo2:1.0
  environment:
    DATOS: /app/datos
    KAFKA: kafka:9092
    API: http://api:8000
    API_KEY: ${API_KEY:-eoi-grupo2}
  volumes:
    - ./datos:/app/datos

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: proyecto-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: quiebres-grupo2-01
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      retries: 12
      start_period: 20s

  ingesta:
    <<: *app
    container_name: proyecto-ingesta
    command: python 1_ingesta.py
    restart: "no"

  simulador:
    <<: *app
    container_name: proyecto-simulador
    command: python 2_simulador.py vivo
    depends_on:
      kafka: {condition: service_healthy}
      ingesta: {condition: service_completed_successfully}
    restart: unless-stopped

  consumidor:
    <<: *app
    container_name: proyecto-consumidor
    command: python 3_consumidor.py
    depends_on:
      kafka: {condition: service_healthy}
    restart: unless-stopped

  procesar:
    <<: *app
    container_name: proyecto-procesar
    command: python 4_procesar.py bucle
    depends_on:
      ingesta: {condition: service_completed_successfully}
    restart: unless-stopped

